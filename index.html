<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Snake Plataforma Mobile</title>
<style>
:root {
    --bark-dark: #2e1f12;
    --bark: #4a3320;
    --bark-light: #7a5230;
    --bark-active: #9a6840;
    --cream: #f6eed6;
    --heart: #ff5a5f;
    --green-accent: #c8f08a;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, #24402b 0%, #14251a 80%);
    color: var(--cream);
    font-family: ui-rounded, "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
    touch-action: none;
}

/* Container principal ajustado para viewport de celular */
#app-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 100vw;
    height: 100vh;
    padding: min(2vw, 10px) min(3vw, 16px);
    box-sizing: border-box;
}

/* HUD Superior */
#hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 960px;
    padding: 6px 16px;
    background: linear-gradient(180deg, var(--bark-light), var(--bark));
    border: 3px solid var(--bark-dark);
    border-radius: 12px;
    font-size: clamp(13px, 2.8vw, 18px);
    font-weight: 800;
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.2), 0 4px 10px rgba(0, 0, 0, 0.4);
    z-index: 10;
}

#hud .heart { color: var(--heart); letter-spacing: 2px; }
#hud .lost { color: rgba(255, 255, 255, 0.25); }

/* Área do Jogo Lado a Lado (Celular Deitado / Landscape) */
#main-area {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vw, 20px);
    width: 100%;
    max-width: 1000px;
    flex: 1;
    min-height: 0; /* Permite redimensionar flex filho */
}

/* Palco / Canvas */
#stage {
    position: relative;
    height: 100%;
    max-height: calc(100vh - 75px);
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    border: 4px solid var(--bark-dark);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    flex-shrink: 1;
    background: #1f3523;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* Mensagens do Jogo */
#msg {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(15, 30, 18, 0.65);
    text-align: center;
    z-index: 20;
}

#msg.show { display: flex; }

#msg .panel {
    padding: 20px 28px;
    background: linear-gradient(180deg, var(--bark-light), var(--bark));
    border: 4px solid var(--bark-dark);
    border-radius: 16px;
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.2), 0 10px 24px rgba(0, 0, 0, 0.6);
}

#msg h2 { margin: 0 0 6px; font-size: clamp(22px, 5vw, 36px); color: var(--green-accent); }
#msg p { margin: 4px 0; font-size: clamp(13px, 3vw, 17px); }

/* Dicas Flutuantes */
#hint {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translate(-50%, -20px);
    opacity: 0;
    padding: 6px 14px;
    background: rgba(46, 31, 18, 0.95);
    border: 2px solid var(--bark-light);
    border-radius: 999px;
    font-size: clamp(12px, 2.5vw, 15px);
    font-weight: 700;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 15;
}

#hint.show { opacity: 1; transform: translate(-50%, 0); }

/* Painel de Controles Virtuais na Direita */
#controls-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: 100%;
    max-height: calc(100vh - 75px);
    padding: 10px 14px;
    background: rgba(30, 20, 12, 0.55);
    border: 3px solid var(--bark-dark);
    border-radius: 18px;
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.1), 0 8px 20px rgba(0,0,0,0.4);
    flex-shrink: 0;
}

/* D-PAD direcionais estilo madeira */
.dpad {
    position: relative;
    width: clamp(130px, 28vh, 170px);
    height: clamp(130px, 28vh, 170px);
}

.btn-ctrl {
    position: absolute;
    width: 33%;
    height: 33%;
    background: linear-gradient(180deg, var(--bark-light), var(--bark));
    border: 3px solid var(--bark-dark);
    border-radius: 12px;
    color: var(--cream);
    font-size: clamp(18px, 4vh, 26px);
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.25), 0 4px 8px rgba(0,0,0,0.4);
    cursor: pointer;
    touch-action: none;
    transition: background 0.1s, transform 0.05s;
}

.btn-ctrl:active, .btn-ctrl.active {
    background: linear-gradient(180deg, var(--bark-active), var(--bark-light));
    transform: scale(0.92);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 4px rgba(0,0,0,0.5);
}

.btn-up { top: 0; left: 33.3%; }
.btn-down { bottom: 0; left: 33.3%; }
.btn-left { top: 33.3%; left: 0; }
.btn-right { top: 33.3%; right: 0; }

.dpad-center {
    position: absolute;
    top: 33.3%;
    left: 33.3%;
    width: 33.3%;
    height: 33.3%;
    background: var(--bark-dark);
    border-radius: 8px;
    opacity: 0.6;
}

/* Botão de Ação / Reiniciar */
.btn-action {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 8px 12px;
    background: linear-gradient(180deg, #4fb34a, #2e7a2b);
    border: 3px solid #1a4a18;
    border-radius: 12px;
    color: #fff;
    font-size: clamp(12px, 2.5vh, 15px);
    font-weight: 800;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), 0 4px 8px rgba(0,0,0,0.35);
    cursor: pointer;
    touch-action: none;
}

.btn-action:active {
    transform: scale(0.94);
    background: linear-gradient(180deg, #3d9339, #235e21);
}

/* Banner de Aviso para Girar Celular se em Pé */
#portrait-warning {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: #d6272d;
    color: #fff;
    text-align: center;
    padding: 4px;
    font-size: 12px;
    font-weight: bold;
    z-index: 100;
}

@media (max-aspect-ratio: 1/1) {
    #portrait-warning { display: block; }
    #main-area { flex-direction: column; }
    #controls-panel { height: auto; flex-direction: row; }
}
</style>
</head>
<body>

<div id="portrait-warning">📱 Gire o celular deitado (Landscape) para a melhor experiência!</div>

<div id="app-container">
    <!-- HUD Superior -->
    <div id="hud"></div>

    <!-- Conteúdo Principal -->
    <div id="main-area">
        <!-- Palco do Jogo -->
        <div id="stage">
            <canvas id="cv"></canvas>
            <div id="hint"></div>
            <div id="msg"><div class="panel"><h2></h2><p></p><p></p></div></div>
        </div>

        <!-- Painel de Controles Direcionais na Direita -->
        <div id="controls-panel">
            <div class="dpad">
                <button class="btn-ctrl btn-up" id="btn-up" aria-label="Cima">▲</button>
                <button class="btn-ctrl btn-left" id="btn-left" aria-label="Esquerda">◄</button>
                <button class="btn-ctrl btn-right" id="btn-right" aria-label="Direita">►</button>
                <button class="btn-ctrl btn-down" id="btn-down" aria-label="Baixo">▼</button>
                <div class="dpad-center"></div>
            </div>
            <button class="btn-action" id="btn-restart">🔄 REINICIAR (R)</button>
        </div>
    </div>
</div>

<script>
/* ============================================================
   CONFIGURAÇÃO E FASE
   ============================================================ */
const W = 20, H = 15, S = 40;            // colunas, linhas, tamanho da célula (px)
const MOVE_FIRST_MS = 190;               // atraso antes de repetir ao segurar
const MOVE_REPEAT_MS = 120;              // intervalo entre movimentos ao segurar
const FALL_MS = 75;                      // tempo por célula na queda

const PLATFORMS = [];
function row(y, x0, x1) { for (let x = x0; x <= x1; x++) PLATFORMS.push({ x, y }); }
row(14, 0, 7);     // chão
row(12, 8, 10);    // degrau 1 (sobe 2)
row(9, 11, 13);    // degrau 2 (sobe 3)
row(5, 14, 17);    // degrau 3 (sobe 4)

const APPLES_START = [{ x: 9, y: 11 }, { x: 12, y: 8 }, { x: 16, y: 4 }];

const PLAT = new Set(PLATFORMS.map(p => p.x + "," + p.y));
const isPlat = (x, y) => PLAT.has(x + "," + y);

/* ============================================================
   CANVAS
   ============================================================ */
const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * S * dpr;
canvas.height = H * S * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

function makeLayer() {
    const c = document.createElement("canvas");
    c.width = W * S * dpr;
    c.height = H * S * dpr;
    const x = c.getContext("2d");
    x.scale(dpr, dpr);
    return { c, x };
}

function mulberry32(a) {
    return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============================================================
   FUNDO: NATUREZA (desenhado em camadas estáticas)
   ============================================================ */
const skyLayer = makeLayer();
const landLayer = makeLayer();

function buildSky(c) {
    const g = c.createLinearGradient(0, 0, 0, H * S);
    g.addColorStop(0, "#74c3ee");
    g.addColorStop(0.55, "#bde8f6");
    g.addColorStop(1, "#eaf7e2");
    c.fillStyle = g;
    c.fillRect(0, 0, W * S, H * S);

    const sun = c.createRadialGradient(690, 95, 10, 690, 95, 120);
    sun.addColorStop(0, "rgba(255,246,190,0.95)");
    sun.addColorStop(1, "rgba(255,246,190,0)");
    c.fillStyle = sun;
    c.fillRect(540, 0, 260, 250);
    c.fillStyle = "#fff4b8";
    c.beginPath(); c.arc(690, 95, 32, 0, Math.PI * 2); c.fill();
}

function hills(c, base, amp, freq, phase, color) {
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(0, H * S);
    for (let x = 0; x <= W * S; x += 8) {
        const y = base - amp * (Math.sin(x * freq + phase) * 0.6 + Math.sin(x * freq * 2.3 + phase * 1.7) * 0.4);
        c.lineTo(x, y);
    }
    c.lineTo(W * S, H * S);
    c.closePath();
    c.fill();
}

function pine(c, x, base, h, leaf, trunk) {
    c.fillStyle = trunk;
    c.fillRect(x - h * 0.045, base - h * 0.22, h * 0.09, h * 0.22);
    c.fillStyle = leaf;
    for (let i = 0; i < 3; i++) {
        const w = h * (0.32 - i * 0.07);
        const top = base - h * (0.95 - i * 0.0) + i * h * 0.22;
        const bot = base - h * 0.16 - (2 - i) * h * 0.2;
        c.beginPath();
        c.moveTo(x, top);
        c.lineTo(x + w, bot + h * 0.2);
        c.lineTo(x - w, bot + h * 0.2);
        c.closePath();
        c.fill();
    }
}

function roundTree(c, x, base, h, leaf, trunk) {
    c.fillStyle = trunk;
    c.fillRect(x - h * 0.05, base - h * 0.45, h * 0.1, h * 0.45);
    c.fillStyle = leaf;
    [[0, 0.68, 0.27], [-0.17, 0.52, 0.21], [0.17, 0.52, 0.21], [0, 0.45, 0.2]].forEach(([dx, dy, r]) => {
        c.beginPath(); c.arc(x + dx * h, base - dy * h, r * h, 0, Math.PI * 2); c.fill();
    });
}

function drawBlock(c, x, y) {
    const px = x * S, py = y * S;
    const rnd = mulberry32(((x * 73856093) ^ (y * 19349663)) >>> 0);

    c.fillStyle = "#8a5a2e";
    c.fillRect(px, py, S, S);

    const tones = ["#7a4e26", "#9a6733", "#6d441f", "#8f5f30", "#855629"];
    let off = 0;
    while (off < S) {
        const w = 4 + Math.floor(rnd() * 6);
        c.fillStyle = tones[Math.floor(rnd() * tones.length)];
        c.fillRect(px + off, py, Math.min(w, S - off), S);
        off += w;
    }

    c.strokeStyle = "rgba(50,28,10,0.55)";
    c.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
        const cx = px + 4 + rnd() * (S - 8);
        const cy = py + 3 + rnd() * (S - 18);
        c.beginPath();
        c.moveTo(cx, cy);
        c.lineTo(cx + (rnd() - 0.5) * 3, cy + 7 + rnd() * 9);
        c.stroke();
    }

    if (rnd() < 0.4) {
        const kx = px + 10 + rnd() * (S - 20);
        const ky = py + 12 + rnd() * (S - 24);
        c.fillStyle = "#4e2f14";
        c.beginPath(); c.ellipse(kx, ky, 5, 3.6, 0, 0, Math.PI * 2); c.fill();
        c.strokeStyle = "#35200d"; c.lineWidth = 1.2;
        c.beginPath(); c.ellipse(kx, ky, 7.5, 5.6, 0, 0, Math.PI * 2); c.stroke();
    }

    c.fillStyle = "rgba(255,225,170,0.25)";
    c.fillRect(px, py, S, 2);
    c.fillRect(px, py, 2, S);
    c.fillStyle = "rgba(30,15,5,0.3)";
    c.fillRect(px, py + S - 3, S, 3);
    c.fillRect(px + S - 2, py, 2, S);

    c.strokeStyle = "#3d2510";
    c.lineWidth = 2;
    c.strokeRect(px + 1, py + 1, S - 2, S - 2);

    if (!isPlat(x, y - 1)) {
        c.fillStyle = "#5cb043";
        c.fillRect(px + 1, py + 1, S - 2, 4);
        for (let k = 0; k < 5; k++) {
            c.beginPath(); c.arc(px + 5 + k * 8.5, py + 5, 4, 0, Math.PI * 2); c.fill();
        }
        c.fillStyle = "rgba(255,255,255,0.22)";
        c.fillRect(px + 2, py + 1, S - 4, 1.5);
    }
}

function buildLand(c) {
    const rnd = mulberry32(2024);

    hills(c, 330, 38, 0.012, 0.6, "#a9dba2");
    hills(c, 390, 34, 0.017, 2.1, "#86cb83");

    for (let x = 14; x < W * S; x += 44 + rnd() * 40) {
        const h = 90 + rnd() * 70;
        const base = 430 + rnd() * 40;
        const palette = ["#6bb872", "#5eae68", "#73c07a"];
        const leaf = palette[Math.floor(rnd() * palette.length)];
        if (rnd() < 0.5) pine(c, x, base, h, leaf, "#7b5b3a");
        else roundTree(c, x, base, h, leaf, "#7b5b3a");
    }

    hills(c, 488, 16, 0.02, 4.2, "#4f9d52");
    c.fillStyle = "#43894a";
    c.fillRect(0, 512, W * S, 60);

    for (let x = 10; x < W * S; x += 38 + rnd() * 50) {
        const y = 496 + rnd() * 14;
        c.fillStyle = rnd() < 0.5 ? "#2f7a3b" : "#378447";
        for (let k = 0; k < 3; k++) {
            c.beginPath(); c.arc(x + k * 11, y - (k === 1 ? 6 : 0), 11 + rnd() * 3, 0, Math.PI * 2); c.fill();
        }
    }

    const colors = ["#ffffff", "#ffd1e8", "#ffe14d", "#ff8fb1"];
    for (let i = 0; i < 70; i++) {
        const fx = rnd() * W * S;
        const fy = 505 + rnd() * 50;
        c.fillStyle = colors[Math.floor(rnd() * colors.length)];
        c.beginPath(); c.arc(fx, fy, 2.2, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#ffcf33";
        c.beginPath(); c.arc(fx, fy, 0.9, 0, Math.PI * 2); c.fill();
    }

    PLATFORMS.forEach(p => drawBlock(c, p.x, p.y));
}

buildSky(skyLayer.x);
buildLand(landLayer.x);

const clouds = [
    { x: 80, y: 70, s: 1.0, v: 6 },
    { x: 360, y: 135, s: 0.8, v: 4 },
    { x: 540, y: 50, s: 1.2, v: 8 },
    { x: 730, y: 160, s: 0.7, v: 5 }
];

function drawCloud(c) {
    const s = c.s;
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    [[0, 0, 22], [26, -9, 27], [54, 0, 22], [27, 8, 22]].forEach(([dx, dy, r]) => {
        ctx.beginPath(); ctx.arc(c.x + dx * s, c.y + dy * s, r * s, 0, Math.PI * 2); ctx.fill();
    });
}

/* ============================================================
   ESTADO DO JOGO
   ============================================================ */
let lives, score, apples, snake, vis, state, facing, headAngle;
let fallT = 0, moveCd = 0, held = [];
let particles = [];
let t = 0;

const hud = document.getElementById("hud");
const msgEl = document.getElementById("msg");
const hintEl = document.getElementById("hint");
let hintTimer = null;

function updateHud() {
    const hearts = '<span class="heart">' + "♥".repeat(lives) + '</span><span class="lost">' + "♥".repeat(3 - lives) + "</span>";
    hud.innerHTML = `<span>Vidas ${hearts}</span><span>Pontos ${score}</span><span>Tamanho ${snake.length}</span>`;
}

function showMsg(title, l1, l2) {
    const p = msgEl.querySelector(".panel");
    p.children[0].textContent = title;
    p.children[1].textContent = l1 || "";
    p.children[2].textContent = l2 || "";
    msgEl.classList.add("show");
}

function hideMsg() { msgEl.classList.remove("show"); }

function hint(text) {
    hintEl.textContent = text;
    hintEl.classList.add("show");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hintEl.classList.remove("show"), 2000);
}

function spawnSnake(len) {
    const hx = Math.max(2, len - 1);
    snake = [];
    for (let i = 0; i < len; i++) snake.push({ x: hx - i, y: 13 });
    vis = snake.map(s => ({ x: s.x, y: s.y }));
    facing = { x: 1, y: 0 };
    headAngle = 0;
}

function newGame() {
    lives = 3;
    score = 0;
    apples = APPLES_START.map(a => ({ ...a }));
    spawnSnake(3);
    state = "play";
    particles = [];
    held = [];
    hideMsg();
    updateHud();
}

/* ============================================================
   REGRAS
   ============================================================ */
function supported() {
    return snake.some(s => isPlat(s.x, s.y + 1));
}

function reachY() {
    let top = Infinity;
    for (const s of snake) if (isPlat(s.x, s.y + 1) && s.y < top) top = s.y;
    return top === Infinity ? 999 : top - (snake.length - 1);
}

function check(dx, dy) {
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

    if (dy === -1) {
        if (!supported()) return { ok: false };
        if (head.y < reachY()) return { ok: false, reason: "short" };
    }
    if (head.x < 0 || head.x >= W || head.y < 0) return { ok: false };
    if (isPlat(head.x, head.y)) return { ok: false };

    const eat = apples.findIndex(a => a.x === head.x && a.y === head.y);
    const body = eat !== -1 ? snake.slice(1) : snake.slice(1, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) return { ok: false };

    return { ok: true, head, eat };
}

function canMoveAny() {
    return [[1, 0], [-1, 0], [0, -1], [0, 1]].some(d => check(d[0], d[1]).ok);
}

function px(cell) { return cell * S + S / 2; }

function burst(x, y, colors, n, speed) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = speed * (0.4 + Math.random() * 0.8);
        particles.push({
            x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.4,
            life: 0.5 + Math.random() * 0.4, max: 0.9,
            r: 2 + Math.random() * 3, color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

function maybeSplash() {
    if (snake[0].y === H - 1 && !isPlat(snake[0].x, snake[0].y)) {
        burst(px(snake[0].x), (H - 1) * S + 10, ["#d8f3ff", "#8fd3f4", "#ffffff"], 14, 180);
    }
}

function afterSettled() {
    if (!canMoveAny()) {
        hint("Cobra presa! Perdeu uma vida");
        loseLife();
    }
}

function move(dx, dy) {
    if (state !== "play") return;
    const r = check(dx, dy);
    if (!r.ok) {
        if (r.reason === "short") hint("Curta demais pra subir mais. Coma maçãs!");
        return;
    }

    facing = { x: dx, y: dy };
    snake.unshift(r.head);
    vis.unshift({ x: vis[0].x, y: vis[0].y });

    if (r.eat !== -1) {
        const a = apples.splice(r.eat, 1)[0];
        score += 10;
        burst(px(a.x), px(a.y), ["#ff5a5f", "#ff8a8e", "#6fcf4a", "#ffffff"], 16, 170);
    } else {
        snake.pop();
        vis.pop();
    }

    updateHud();

    if (apples.length === 0) {
        state = "won";
        showMsg("Você venceu!", "Todas as maçãs coletadas", "Toque em Reiniciar para jogar de novo");
        return;
    }

    maybeSplash();

    if (!supported()) {
        state = "falling";
        fallT = 0;
    } else {
        afterSettled();
    }
}

function stepFall() {
    if (supported()) {
        state = "play";
        afterSettled();
        return;
    }
    snake.forEach(s => s.y++);
    maybeSplash();

    if (snake.every(s => s.y >= H)) {
        loseLife();
        return;
    }
    if (supported()) {
        state = "play";
        afterSettled();
    }
}

function loseLife() {
    lives--;
    if (lives <= 0) {
        state = "over";
        updateHud();
        showMsg("Fim de jogo", "Pontos: " + score, "Toque em Reiniciar para tentar de novo");
        return;
    }
    const n = snake.length;
    spawnSnake(n);
    state = "play";
    held = [];
    updateHud();
    if (!hintEl.classList.contains("show")) hint("Caiu! Você voltou ao início");
}

/* ============================================================
   ENTRADA (TECLADO + CONTROLES TOUCH VIRTUAIS)
   ============================================================ */
const KEYS = {
    ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1],
    a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1]
};

function normKey(k) { return k.length === 1 ? k.toLowerCase() : k; }

document.addEventListener("keydown", e => {
    const k = normKey(e.key);
    if (k === "r") { newGame(); return; }
    if (!KEYS[k]) return;
    e.preventDefault();
    if (e.repeat) return;
    held = held.filter(h => h !== k);
    held.push(k);
    move(KEYS[k][0], KEYS[k][1]);
    moveCd = MOVE_FIRST_MS;
});

document.addEventListener("keyup", e => {
    const k = normKey(e.key);
    held = held.filter(h => h !== k);
});

window.addEventListener("blur", () => { held = []; });

/* Configuração dos Botões Virtuais da Direita */
function setupVirtualButton(btnId, keyName) {
    const btn = document.getElementById(btnId);
    if (!btn) return;

    const pressHandler = (e) => {
        if (e.cancelable) e.preventDefault();
        btn.classList.add("active");
        const k = normKey(keyName);
        held = held.filter(h => h !== k);
        held.push(k);
        move(KEYS[k][0], KEYS[k][1]);
        moveCd = MOVE_FIRST_MS;
    };

    const releaseHandler = (e) => {
        if (e.cancelable) e.preventDefault();
        btn.classList.remove("active");
        const k = normKey(keyName);
        held = held.filter(h => h !== k);
    };

    btn.addEventListener("touchstart", pressHandler, { passive: false });
    btn.addEventListener("touchend", releaseHandler, { passive: false });
    btn.addEventListener("touchcancel", releaseHandler, { passive: false });
    btn.addEventListener("mousedown", pressHandler);
    btn.addEventListener("mouseup", releaseHandler);
    btn.addEventListener("mouseleave", releaseHandler);
}

setupVirtualButton("btn-up", "ArrowUp");
setupVirtualButton("btn-down", "ArrowDown");
setupVirtualButton("btn-left", "ArrowLeft");
setupVirtualButton("btn-right", "ArrowRight");

const btnRestart = document.getElementById("btn-restart");
btnRestart.addEventListener("click", () => newGame());
btnRestart.addEventListener("touchstart", (e) => {
    if (e.cancelable) e.preventDefault();
    newGame();
}, { passive: false });

/* ============================================================
   ATUALIZAÇÃO DE QUADRO
   ============================================================ */
function update(dt) {
    t += dt;

    if (!REDUCED) {
        clouds.forEach(c => { c.x += c.v * dt; if (c.x > W * S + 100) c.x = -140; });
    }

    if (state === "play" && held.length) {
        moveCd -= dt * 1000;
        if (moveCd <= 0) {
            const d = KEYS[held[held.length - 1]];
            if (d) move(d[0], d[1]);
            moveCd = MOVE_REPEAT_MS;
        }
    }

    if (state === "falling") {
        fallT += dt * 1000;
        while (fallT >= FALL_MS && state === "falling") {
            fallT -= FALL_MS;
            stepFall();
        }
    }

    const k = 1 - Math.exp(-dt * 24);
    for (let i = 0; i < vis.length; i++) {
        vis[i].x += (snake[i].x - vis[i].x) * k;
        vis[i].y += (snake[i].y - vis[i].y) * k;
    }

    const target = Math.atan2(facing.y, facing.x);
    const diff = ((target - headAngle + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    headAngle += diff * (1 - Math.exp(-dt * 20));

    for (const p of particles) {
        p.vy += 520 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
}

/* ============================================================
   DESENHO DA COBRINHA FELIZ E ELEMENTOS
   ============================================================ */
const OUTLINE_DARK = "#123810";
const BODY_GREEN = "#38be28";
const BELLY_YELLOW = "#dbe833";

function drawApple(a) {
    const cx = px(a.x);
    const cy = px(a.y) + (REDUCED ? 0 : Math.sin(t * 3 + a.x) * 2);

    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.ellipse(cx, px(a.y) + 14, 10, 3, 0, 0, Math.PI * 2); ctx.fill();

    const g = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, 14);
    g.addColorStop(0, "#ff8a8e");
    g.addColorStop(1, "#d6272d");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx - 4.5, cy + 1, 10, 0, Math.PI * 2);
    ctx.arc(cx + 4.5, cy + 1, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx, cy - 8); ctx.lineTo(cx + 2, cy - 15); ctx.stroke();

    ctx.fillStyle = "#4fb34a";
    ctx.beginPath(); ctx.ellipse(cx + 8, cy - 12, 7, 3.5, -0.5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.beginPath(); ctx.ellipse(cx - 7, cy - 3, 2.6, 4, 0.5, 0, Math.PI * 2); ctx.fill();
}

function snakePath(P) {
    ctx.beginPath();
    ctx.moveTo(P[0].x, P[0].y);
    for (let i = 1; i < P.length - 1; i++) {
        const mx = (P[i].x + P[i + 1].x) / 2;
        const my = (P[i].y + P[i + 1].y) / 2;
        ctx.quadraticCurveTo(P[i].x, P[i].y, mx, my);
    }
    ctx.lineTo(P[P.length - 1].x, P[P.length - 1].y);
}

function drawSnake() {
    const pts = vis.map(p => ({ x: px(p.x), y: px(p.y) }));
    const P = pts.slice().reverse(); // cauda -> cabeça

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // 1. Sombra projetada
    ctx.save();
    ctx.translate(0, 4);
    ctx.strokeStyle = "rgba(0,0,0,0.2)";
    ctx.lineWidth = 32;
    snakePath(P); ctx.stroke();
    ctx.restore();

    // 2. Contorno externo escuro
    ctx.strokeStyle = OUTLINE_DARK;
    ctx.lineWidth = 32;
    snakePath(P); ctx.stroke();

    // 3. Corpo verde vibrante
    ctx.strokeStyle = BODY_GREEN;
    ctx.lineWidth = 24;
    snakePath(P); ctx.stroke();

    // 4. Barriguinha amarela recortada (estilo gomos/lagarta da imagem)
    for (let i = 0; i < pts.length - 1; i++) {
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const dist = Math.hypot(dx, dy);
        if (dist === 0) continue;

        // Vetor normal apontando para a barriga (abaixo)
        const nx = -dy / dist;
        const ny = dx / dist;

        const mx = (p1.x + p2.x) / 2;
        const my = (p1.y + p2.y) / 2;

        ctx.fillStyle = BELLY_YELLOW;
        ctx.strokeStyle = OUTLINE_DARK;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(mx + nx * 5, my + ny * 5, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    // Pista amarela central suave
    ctx.strokeStyle = BELLY_YELLOW;
    ctx.lineWidth = 8;
    snakePath(P); ctx.stroke();

    // Manchinhas verdes escuras nas costas
    ctx.fillStyle = "#228018";
    for (let i = 1; i < pts.length; i += 2) {
        ctx.beginPath();
        ctx.ellipse(pts[i].x, pts[i].y - 2, 4.5, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    drawHead(pts[0]);
}

/* Desenho do Rosto FELIZ com olhos cartoon, cílios e sorriso */
function drawHead(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(headAngle);

    // Língua simpática (animada)
    if (Math.sin(t * 6) > 0.2) {
        ctx.strokeStyle = "#ff4d6d";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(27, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(27, 0); ctx.lineTo(32, -4); ctx.moveTo(27, 0); ctx.lineTo(32, 4); ctx.stroke();
    }

    // Cabeça Verde com Contorno
    ctx.fillStyle = OUTLINE_DARK;
    ctx.beginPath(); ctx.ellipse(3, 0, 21, 19, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = BODY_GREEN;
    ctx.beginPath(); ctx.ellipse(3, 0, 18, 16, 0, 0, Math.PI * 2); ctx.fill();

    // Queixo/Barriguinha amarela na cabeça
    ctx.fillStyle = BELLY_YELLOW;
    ctx.beginPath(); ctx.ellipse(1, 6, 14, 8, 0.2, 0, Math.PI); ctx.fill();

    // Bochechas rosadas de felicidade
    ctx.fillStyle = "rgba(255, 105, 145, 0.65)";
    ctx.beginPath(); ctx.arc(-2, -10, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-2, 10, 4, 0, Math.PI * 2); ctx.fill();

    // Sorriso grande e alegre
    ctx.strokeStyle = OUTLINE_DARK;
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(8, 2, 7, 0.1, Math.PI * 0.8, false);
    ctx.stroke();

    ctx.fillStyle = "#ff5277";
    ctx.beginPath();
    ctx.arc(8, 2, 5.5, 0.2, Math.PI * 0.75, false);
    ctx.fill();

    // Olhos Expressivos (Inspirados na imagem, mas FELIZES)
    [-1, 1].forEach(sgn => {
        const ey = sgn * 8.5;
        const ex = 5;

        // Fundo do Olho (Branco)
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = OUTLINE_DARK;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(ex, ey, 6.5, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Pupilas Grandes
        ctx.fillStyle = "#161616";
        ctx.beginPath();
        ctx.arc(ex + 1.8, ey + sgn * 0.5, 3.2, 0, Math.PI * 2);
        ctx.fill();

        // Brilho no Olhar
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(ex + 3, ey + sgn * 0.5 - 1.2, 1.2, 0, Math.PI * 2);
        ctx.fill();

        // Pálpebra de cima estilo lagarta
        ctx.fillStyle = BODY_GREEN;
        ctx.strokeStyle = OUTLINE_DARK;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(ex - 0.5, ey - sgn * 2.5, 6.8, 4, sgn * 0.2, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Cílios fofos estilo desenho (como na imagem)
        ctx.strokeStyle = OUTLINE_DARK;
        ctx.lineWidth = 1.8;
        ctx.lineCap = "round";
        for (let lash = 0; lash < 2; lash++) {
            const lx = ex - 2 + lash * 4;
            const ly = ey - sgn * 5;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx - 1, ly - sgn * 4);
            ctx.stroke();
        }

        // Sobrancelhas Arquedas de Felicidade (^ ^)
        ctx.strokeStyle = OUTLINE_DARK;
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        const bx = ex - 1;
        const by = ey - sgn * 7.5;
        ctx.moveTo(bx - 3, by + sgn * 1.5);
        ctx.quadraticCurveTo(bx, by - sgn * 3, bx + 4, by + sgn * 1);
        ctx.stroke();
    });

    ctx.restore();
}

function drawWater() {
    const y0 = (H - 1) * S;
    const g = ctx.createLinearGradient(0, y0, 0, H * S);
    g.addColorStop(0, "rgba(86,190,232,0.82)");
    g.addColorStop(1, "rgba(22,98,160,0.95)");

    for (let x = 0; x < W * S; x += 4) {
        if (isPlat(Math.floor(x / S), H - 1)) continue;
        const top = y0 + 8 + (REDUCED ? 0 : Math.sin(t * 2.2 + x * 0.05) * 3);
        ctx.fillStyle = g;
        ctx.fillRect(x, top, 4, H * S - top);
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.fillRect(x, top, 4, 2);
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function draw() {
    ctx.drawImage(skyLayer.c, 0, 0, W * S, H * S);
    clouds.forEach(drawCloud);
    ctx.drawImage(landLayer.c, 0, 0, W * S, H * S);
    apples.forEach(drawApple);
    drawSnake();
    drawWater();
    drawParticles();
}

/* ============================================================
   LOOP PRINCIPAL
   ============================================================ */
let last = performance.now();
function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
}

newGame();
requestAnimationFrame(frame);
</script>
